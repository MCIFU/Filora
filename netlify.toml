# Versión web de solo lectura de Mi Cinemateca.
# En cada push a GitHub, Netlify genera los datos estáticos y publica la carpeta app/.
[build]
  command = "python3 tools/build_static.py"
  publish = "app"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
