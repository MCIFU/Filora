name: Pruebas

on:
  push:
    branches: [main]
    paths: ["app/**", "api/**", "lib/**", "tests/**", "package*.json", ".github/workflows/pruebas.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API
        run: npm test
      - name: Navegador
        run: npx playwright install --with-deps chromium && npm run test:web
