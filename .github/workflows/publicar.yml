name: Publicar en Vercel
# Vercel solo publica los commits de main con [publicar] en el mensaje (tools/vercel_publicar.mjs).
# Este flujo deja ese commit una vez al día (para la cartelera) o cuando lo lances a mano:
# pestaña Actions → «Publicar en Vercel» → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"   # 07:30 en España (invierno) / 08:30 (verano)
permissions:
  contents: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marcar la publicación
        run: |
          git config user.name "publicar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > data/publicado.txt
          git add data/publicado.txt
          git commit -m "Publicar en Vercel: $(date +%Y-%m-%d) [publicar]"
          git push
