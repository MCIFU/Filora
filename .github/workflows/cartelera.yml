name: Actualizar cartelera y estrenos

on:
  schedule:
    - cron: "0 5-20/3 * * *"   # cada 3 horas de 07:00 a 22:00 (hora de España en verano)
  workflow_dispatch: {}         # a mano, o desde la web cuando alguien elige un cine nuevo

# una descarga cada vez; si llega otra petición mientras tanto, se hace justo después
concurrency:
  group: cartelera
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar sesiones y estrenos de FilmAffinity
        run: python tools/cartelera.py
      - name: Guardar cambios (la web los lee directamente de GitHub)
        run: |
          git config user.name "cartelera-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/estrenos.json data/fa_cache.json data/cines_es.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Cartelera y estrenos: $(date +%Y-%m-%d) [skip netlify]"
            git push
          fi
