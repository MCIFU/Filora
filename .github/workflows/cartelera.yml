name: Actualizar cartelera y estrenos

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días a las 07:00 (hora de España en verano)
  workflow_dispatch: {}    # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar sesiones y estrenos de FilmAffinity
        run: python tools/cartelera.py
      - name: Copia de seguridad de la colección (lo añadido desde la web)
        run: |
          curl -sf https://filora.vercel.app/api/db -o /tmp/db.json || exit 0
          python - <<'PY'
          import json, pathlib
          nuevo = json.load(open("/tmp/db.json", encoding="utf-8"))
          ruta = pathlib.Path("data/db.json")
          viejo = json.loads(ruta.read_text(encoding="utf-8"))
          # protección: nunca guardar una copia claramente incompleta
          # y solo si la web tiene datos más recientes que el repositorio
          if len(nuevo.get("peliculas", [])) >= 0.9 * len(viejo.get("peliculas", [])) and nuevo.get("peliculas") and str(nuevo.get("actualizado", "")) > str(viejo.get("actualizado", "")):
              nuevo.pop("estado", None)
              ruta.write_text(json.dumps(nuevo, ensure_ascii=False, indent=1), encoding="utf-8")
              print("Copia actualizada:", len(nuevo["peliculas"]), "películas")
          else:
              print("Copia no actualizada (la web no tiene datos más recientes)")
          PY
      - name: Guardar cambios (la web los lee directamente de GitHub)
        run: |
          git config user.name "cartelera-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/estrenos.json data/fa_cache.json data/db.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Cartelera y estrenos: $(date +%Y-%m-%d) [skip netlify]"
            git push
          fi
