name: Actualizar historia de los premios

on:
  schedule:
    - cron: "0 4 2 * *"   # el día 2 de cada mes (recoge las galas recientes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premios
  cancel-in-progress: false

jobs:
  premios:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar ganadores y nominados de Wikidata
        run: python -u tools/premios.py
      - name: Completar nominados con Wikipedia y fotos
        run: |
          pip install beautifulsoup4
          python -u tools/premios_wiki.py
      - name: Guardar cambios
        run: |
          git config user.name "cartelera-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/premios
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Premios: historia actualizada $(date +%Y-%m-%d) [skip netlify]"
            git pull --rebase
            git push
          fi
